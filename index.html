<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC 交易主控台</title>
<meta name="description" content="比特幣永續合約的即時行情、多時間框架訊號與進場計畫。">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="topbar">
  <span class="dot" id="conn-dot"></span>
  <span class="brand">BTC<b>USDT</b></span>
  <span class="src" id="src-name">—</span>
  <span class="spacer"></span>
  <button class="ghost-btn" id="theme-toggle" type="button">淺色</button>
</div>

<div class="wrap">

  <nav class="nav">
    <a href="index.html" aria-current="page">主控台</a>
    <a href="screener.html">篩選器</a>
    <a href="sim.html">模擬・回測</a>
    <a href="journal.html">交易日誌</a>
  </nav>

  <!-- 價格 -->
  <div class="px-head">
    <div>
      <div class="px-sym">永續合約 PERP</div>
      <div class="px-last" id="px-last">—</div>
    </div>
    <div class="px-chg" id="px-chg">—</div>
    <div class="px-meta" id="px-meta"></div>
  </div>

  <!-- 週期 -->
  <div class="tfbar" id="tfbar">
    <button type="button" data-tf="15m" aria-pressed="false">15m</button>
    <button type="button" data-tf="1h"  aria-pressed="false">1H</button>
    <button type="button" data-tf="4h"  aria-pressed="true">4H</button>
    <button type="button" data-tf="1d"  aria-pressed="false">1D</button>
  </div>

  <canvas id="chart"></canvas>
  <div class="ma-legend" id="ma-legend"></div>

  <!-- 指標 -->
  <div class="ind-row" id="ind-row"></div>

  <!-- 多時間框架 -->
  <div class="mtf" id="mtf"></div>

  <!-- 進場計畫 -->
  <div class="plan" id="plan"></div>

  <!-- 參數 -->
  <div class="params">
    <div class="field">
      <label for="p-equity">本金 USDT</label>
      <input type="number" id="p-equity" value="44" step="1" inputmode="decimal">
    </div>
    <div class="field">
      <label for="p-risk">風險 %</label>
      <input type="number" id="p-risk" value="1" step="0.1" inputmode="decimal">
    </div>
    <div class="field">
      <label for="p-lev">槓桿 x</label>
      <input type="number" id="p-lev" value="20" step="1" min="1" inputmode="decimal">
    </div>
  </div>

  <div class="bar-actions">
    <button class="ghost-btn" id="refresh" type="button">重新整理</button>
    <span class="updated" id="updated"></span>
  </div>

  <div id="warnings"></div>

  <div class="disclaimer">
    只讀取交易所公開行情，不連接帳戶、不能下單。所有價位是依你輸入的參數算出的數學結果，不是投資建議。
    爆倉價請以交易所 App 顯示的為準。
  </div>

</div>

<script src="assets/theme.js"></script>
<script src="assets/risk.js"></script>
<script src="assets/indicators.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/data.js"></script>
<script src="assets/chart.js"></script>
<script src="assets/dash.js"></script>
</body>
</html>
