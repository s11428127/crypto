<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幣種篩選器</title>
<meta name="description" content="掃描成交量前段的永續合約，排出偏多與偏空的清單。">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="topbar">
  <span class="brand">BTC<b>USDT</b></span>
  <span class="src" id="src-name">篩選器</span>
  <span class="spacer"></span>
  <button class="ghost-btn" id="theme-toggle" type="button">淺色</button>
</div>

<div class="wrap">
  <nav class="nav">
    <a href="index.html">主控台</a>
    <a href="screener.html" aria-current="page">篩選器</a>
    <a href="sim.html">模擬・回測</a>
    <a href="journal.html">交易日誌</a>
  </nav>

  <div class="sec">
    <h2>偏多／偏空清單</h2>
    <p class="hint">
      掃成交量前段的 USDT 永續，每個幣算一組分數：趨勢一致性、相對 BTC 強弱、RSI 位置、資金費率。
      分數為正偏多、為負偏空，絕對值越大訊號越強。點一列看評分理由。
    </p>

    <div class="params">
      <div class="field"><label for="sc-count">掃描幣數</label>
        <select id="sc-count">
          <option value="20">前 20</option>
          <option value="30" selected>前 30</option>
          <option value="50">前 50</option>
        </select></div>
      <div class="field"><label for="sc-vol">最低 24h 量 (M USDT)</label>
        <input type="number" id="sc-vol" value="50" step="10" inputmode="decimal"></div>
    </div>

    <div class="bar-actions">
      <button class="btn" id="run-scan" type="button">開始掃描</button>
      <span class="updated" id="sc-status"></span>
    </div>
    <div class="progress" id="sc-prog" hidden><i></i></div>
    <div id="sc-warn"></div>
  </div>

  <div class="sec">
    <h2 style="color:var(--long)">偏多</h2>
    <div class="tbl-wrap" id="longs"><div class="empty">尚未掃描</div></div>
  </div>

  <div class="sec">
    <h2 style="color:var(--short)">偏空</h2>
    <div class="tbl-wrap" id="shorts"><div class="empty">尚未掃描</div></div>
  </div>

  <div id="detail"></div>

  <div class="alert warn" style="margin-top:20px">
    <b>山寨幣合約是新手最容易出事的地方</b>
    流動性比 BTC 薄很多，一根針就能把你的止損掃掉再走回原方向。
    這張表初期建議只當觀察用，實單先在 BTC / ETH 上練，等累積 2~3 個月的交易紀錄再考慮。
  </div>

  <div class="disclaimer">
    分數是依公開行情算出的量化結果，不是推薦標的、不是投資建議。
  </div>
</div>

<script src="assets/theme.js"></script>
<script src="assets/risk.js"></script>
<script src="assets/indicators.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/screener.js"></script>
<script src="assets/data.js"></script>
<script src="assets/screener-page.js"></script>
</body>
</html>
